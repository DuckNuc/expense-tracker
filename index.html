<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Витрати">
<title>Витрати</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111318; --muted: #6b7280; --faint: #9ca3af;
    --line: #eceef1; --accent: #0d9488; --accent-2: #14b8a6; --accent-soft: #ccfbf1; --danger: #e11d48;
    --on-accent: #ffffff; --radius: 20px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d10; --card: #16191e; --text: #f2f3f5; --muted: #9aa1ac; --faint: #6b7280;
      --line: #242830; --accent: #2dd4bf; --accent-2: #0d9488; --accent-soft: #113532; --danger: #fb7185;
      --on-accent: #04201d; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding: env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  input, select { font: inherit; color: var(--text); }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  [hidden] { display: none !important; }

  /* ---------- Top bar: left button · centered title · right button ---------- */
  .topbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 60px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:active { background: var(--line); }
  .icon-btn.ghost { visibility: hidden; }
  .center { display: flex; justify-content: center; min-width: 0; }
  .month-switch { display: flex; align-items: center; gap: 2px; background: var(--card); border-radius: 99px; padding: 4px; box-shadow: var(--shadow); }
  .month-switch button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .month-switch button:active { background: var(--line); }
  .month-switch svg.i { width: 18px; height: 18px; }
  .month-title { min-width: 132px; text-align: center; font-weight: 650; font-size: 15px; text-transform: capitalize; }
  .page-title { font-weight: 650; font-size: 17px; }

  /* ---------- Hero summary ---------- */
  .hero { margin-top: 8px; border-radius: 24px; padding: 22px 20px 20px; text-align: center; color: #fff;
    background: linear-gradient(140deg, #0f766e 0%, #0d9488 55%, #14b8a6 100%);
    box-shadow: 0 10px 30px rgba(13,148,136,.28); position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%; right: -70px; top: -90px;
    background: rgba(255,255,255,.08); pointer-events: none; }
  .hero::before { content: ""; position: absolute; width: 160px; height: 160px; border-radius: 50%; left: -60px; bottom: -80px;
    background: rgba(255,255,255,.06); pointer-events: none; }
  @media (prefers-color-scheme: dark) { .hero { box-shadow: none; background: linear-gradient(140deg, #115e59, #0f766e 60%, #0d9488); } }
  .hero-label { font-size: 14px; opacity: .85; }
  .hero-total { font-size: 40px; font-weight: 750; letter-spacing: -.02em; margin: 2px 0 16px; font-variant-numeric: tabular-nums; }
  .hero-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; background: rgba(255,255,255,.12); border-radius: 16px; padding: 12px 4px; }
  .hero-stats > div { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .hero-stats > div + div { border-left: 1px solid rgba(255,255,255,.18); }
  .hero-stats b { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 4px; }
  .hero-stats span { font-size: 12px; opacity: .8; }
  .hero-bar { height: 6px; background: rgba(255,255,255,.22); border-radius: 99px; overflow: hidden; margin-top: 14px; }
  .hero-bar > i { display: block; height: 100%; background: #fff; border-radius: 99px; transition: width .4s; }
  .hero-bar.over > i { background: #fecdd3; }

  /* ---------- Expense list ---------- */
  .day { margin-top: 22px; }
  .day-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 550; padding: 0 6px 8px; }
  .day-head span:first-child::first-letter { text-transform: uppercase; }
  .list { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; width: 100%; text-align: left; }
  .item + .item { border-top: 1px solid var(--line); }
  .item:active { background: var(--bg); }
  .emoji { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; flex: none; }
  .item .meta { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; }
  .item .note { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .amt { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .empty { text-align: center; color: var(--muted); padding: 56px 24px; }
  .empty .ico { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .empty .ico svg.i { width: 30px; height: 30px; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

  /* ---------- Stats ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-top: 12px; }
  .donut-wrap { display: flex; justify-content: center; padding: 6px 0 14px; }
  .stat-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
  .stat-row + .stat-row { border-top: 1px solid var(--line); }
  .stat-row .meta { flex: 1; min-width: 0; }
  .stat-row .top { display: flex; justify-content: space-between; gap: 8px; }
  .stat-row .name { font-weight: 600; }
  .stat-row .pct { color: var(--muted); font-size: 13px; font-weight: 500; margin-left: 4px; }
  .stat-row .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 7px; }
  .stat-row .bar > i { display: block; height: 100%; border-radius: 99px; }

  /* ---------- Settings ---------- */
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin: 26px 6px 8px; }
  h2:first-child { margin-top: 8px; }
  .group { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 0 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .lbl { display: flex; align-items: center; gap: 12px; }
  .row .lbl small { display: block; color: var(--muted); font-size: 12px; }
  .row-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
  .row-ico svg.i { width: 18px; height: 18px; }
  .row input[type=number], .row select { border: 0; background: var(--bg); border-radius: 10px; padding: 8px 10px; width: 120px; text-align: right; }
  .row button.act { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; text-align: left; }
  .row.danger, .row.danger .row-ico { color: var(--danger); }
  .row.danger .row-ico { background: color-mix(in srgb, var(--danger) 14%, transparent); }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 6px 0; text-align: center; }

  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: .2s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: .2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:disabled + span { opacity: .5; }

  .cat-edit { display: flex; align-items: center; gap: 12px; min-height: 56px; }
  .cat-edit + .cat-edit { border-top: 1px solid var(--line); }
  .cat-edit .nm { flex: 1; font-weight: 550; }
  .cat-edit .emoji { width: 34px; height: 34px; font-size: 17px; border-radius: 10px; }
  .cat-edit button { color: var(--faint); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
  .cat-edit button:active { background: var(--line); color: var(--danger); }
  .cat-edit button svg.i { width: 18px; height: 18px; }
  .add-cat { display: flex; gap: 8px; padding: 12px 0 16px; border-top: 1px solid var(--line); }
  .add-cat input { border: 0; background: var(--bg); border-radius: 12px; padding: 11px 12px; min-width: 0; }
  .add-cat input.em { width: 52px; text-align: center; }
  .add-cat input.nm { flex: 1; }
  .add-cat button { width: 46px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }

  /* ---------- Bottom tab bar: tab · FAB · tab ---------- */
  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
    padding: 0 16px calc(12px + env(safe-area-inset-bottom)); }
  nav.tabbar .bar { pointer-events: auto; max-width: 360px; margin: 0 auto; height: 64px; border-radius: 24px;
    display: grid; grid-template-columns: 1fr 76px 1fr; align-items: center;
    background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 30px rgba(16,24,40,.12); border: 1px solid var(--line); }
  .tab { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 550; color: var(--faint); }
  .tab.on { color: var(--accent); }
  .fab { justify-self: center; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; color: #fff; transform: translateY(-14px);
    background: linear-gradient(140deg, #0f766e, #14b8a6); box-shadow: 0 8px 20px rgba(13,148,136,.45), 0 0 0 5px var(--bg); }
  .fab svg.i { width: 28px; height: 28px; stroke-width: 2.4; }
  .fab:active { transform: translateY(-14px) scale(.94); }

  /* ---------- Bottom sheet ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--card); border-radius: 26px 26px 0 0;
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); max-height: 92vh; overflow-y: auto;
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet.open { transform: none; }
  .sheet .inner { max-width: 560px; margin: 0 auto; }
  .grabber { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 6px; }
  .sheet-title { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; text-align: center; }
  .sheet-title b { font-size: 17px; }
  .amount-input { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 10px 0 18px; }
  .amount-input input { border: 0; background: none; font-size: 46px; font-weight: 750; width: 2ch; max-width: 80%; text-align: center; outline: none; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .amount-input .cur { font-size: 28px; color: var(--faint); font-weight: 650; }
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .cat { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px; border-radius: 16px; font-size: 12px; border: 2px solid transparent; background: var(--bg); min-width: 0; }
  .cat .e { font-size: 22px; }
  .cat .t { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .cat.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .fields input { width: 100%; min-width: 0; border: 0; background: var(--bg); border-radius: 14px; padding: 13px 14px; }
  .fields .full { grid-column: 1 / -1; }
  .btn { display: block; width: 100%; padding: 15px; border-radius: 16px; background: var(--bg); font-weight: 600; text-align: center; }
  .btn + .btn { margin-top: 8px; }
  .btn.primary { background: linear-gradient(140deg, #0f766e, #14b8a6); color: #fff; }
  .btn.danger { color: var(--danger); background: none; }

  /* ---------- Lock screen ---------- */
  .lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
  .lock img { width: 76px; height: 76px; border-radius: 22px; box-shadow: 0 10px 30px rgba(13,148,136,.3); }
  .lock h1 { font-size: 24px; margin: 18px 0 4px; }
  .lock p { color: var(--muted); margin: 0; }
  .fp { margin: 44px 0 14px; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; color: var(--accent);
    background: var(--accent-soft); box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent-soft) 45%, transparent); }
  .fp svg.i { width: 42px; height: 42px; stroke-width: 1.8; }
  .fp:active { transform: scale(.95); }
  .lock .reset { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); color: var(--faint); font-size: 13px; padding: 8px; }
  body.locked .app { visibility: hidden; }

  .toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 14px; font-size: 14px; font-weight: 550; opacity: 0; transition: .2s; z-index: 60; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
  <symbol id="i-pie" viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.6A9 9 0 0 1 20.4 9H15z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></symbol>
  <symbol id="i-finger" viewBox="0 0 24 24"><path d="M12 10.5v3.5a9 9 0 0 1-1.6 5"/><path d="M8.5 12a3.5 3.5 0 0 1 7 0v2a13 13 0 0 1-1.1 5"/><path d="M5.3 15.5A11 11 0 0 1 5 12a7 7 0 0 1 12.4-4.4"/><path d="M18.8 10.3c.1.6.2 1.1.2 1.7v2a17 17 0 0 1-.6 4.3"/><path d="M7.6 19.6A10 10 0 0 0 9.2 15"/><path d="M6.2 5.6A9.6 9.6 0 0 1 12 3.5c1.6 0 3.1.4 4.4 1.1"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/><path d="M6 6l9-3 1 3"/></symbol>
  <symbol id="i-coins" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 10h18M9 10v10"/></symbol>

<div class="app">
  <header class="wrap topbar">
    <button class="icon-btn ghost" id="leftBtn" aria-label="Заблокувати"><svg class="i"><use href="#i-lock"/></svg></button>
    <div class="center">
      <div class="month-switch" id="monthSwitch">
        <button id="prev" aria-label="Попередній місяць"><svg class="i"><use href="#i-left"/></svg></button>
        <div class="month-title" id="monthTitle"></div>
        <button id="next" aria-label="Наступний місяць"><svg class="i"><use href="#i-right"/></svg></button>
      </div>
      <div class="page-title" id="pageTitle" hidden>Налаштування</div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Налаштування"><svg class="i"><use href="#i-settings"/></svg></button>
  </header>

  <main class="wrap">
    <!-- Витрати -->
    <section id="view-home">
      <div class="hero">
        <div class="hero-label" id="heroLabel">Витрачено</div>
        <div class="hero-total" id="total"></div>
        <div class="hero-stats">
          <div><b id="sCount"></b><span id="sCountLbl">записів</span></div>
          <div><b id="sDay"></b><span>на день</span></div>
          <div><b id="sLeft"></b><span id="sLeftLbl">залишок</span></div>
        </div>
        <div class="hero-bar" id="budgetBar" hidden><i></i></div>
      </div>
      <div id="days"></div>
    </section>

    <!-- Статистика -->
    <section id="view-stats" hidden>
      <div class="card">
        <div class="donut-wrap" id="donut"></div>
        <div id="statList"></div>
      </div>
    </section>

    <!-- Налаштування -->
    <section id="view-settings" hidden>
      <h2>Безпека</h2>
      <div class="group">
        <div class="row">
          <div class="lbl"><div class="row-ico"><svg class="i"><use href="#i-finger"/></svg></div>
            <div>Вхід по відбитку<small id="lockHint">Face ID / Touch ID на iPhone</small></div></div>
          <label class="switch"><input type="checkbox" id="lockToggle" aria-label="Вхід по відбитку"><span></span></label>
        </div>
      </div>

      <h2>Бюджет</h2>
      <div class="group">
        <div class="row">
          <div class="lbl"><div class="row-ico"><svg class="i"><use href="#i-wallet"/></svg></div><label for="budget">Бюджет на місяць</label></div>
          <input id="budget" type="number" inputmode="decimal" min="0" placeholder="0">
        </div>
        <div class="row">
          <div class="lbl"><div class="row-ico"><svg class="i"><use href="#i-coins"/></svg></div><label for="currency">Валюта</label></div>
          <select id="currency"><option>₴</option><option>$</option><option>€</option><option>zł</option><option>£</option></select>
        </div>
      </div>

      <h2>Категорії</h2>
      <div class="group">
        <div id="catEditList"></div>
        <div class="add-cat">
          <input class="em" id="newCatEmoji" maxlength="4" placeholder="🙂" aria-label="Емодзі">
          <input class="nm" id="newCatName" maxlength="20" placeholder="Нова категорія">
          <button id="addCat" aria-label="Додати категорію"><svg class="i"><use href="#i-plus"/></svg></button>
        </div>
      </div>

      <h2>Дані</h2>
      <div class="group">
        <div class="row"><button class="act" id="exportJson"><div class="row-ico"><svg class="i"><use href="#i-save"/></svg></div>Зберегти резервну копію</button></div>
        <div class="row"><button class="act" id="importBtn"><div class="row-ico"><svg class="i"><use href="#i-upload"/></svg></div>Відновити з копії</button></div>
        <div class="row"><button class="act" id="exportCsv"><div class="row-ico"><svg class="i"><use href="#i-table"/></svg></div>Експорт у CSV (Excel)</button></div>
        <div class="row danger"><button class="act" id="wipe"><div class="row-ico"><svg class="i"><use href="#i-trash"/></svg></div>Видалити всі дані</button></div>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <p class="hint">Дані зберігаються лише на цьому телефоні — без реклами, акаунтів і серверів.</p>
    </section>
  </main>

  <nav class="tabbar">
    <div class="bar">
      <button class="tab on" data-view="home"><svg class="i"><use href="#i-list"/></svg>Витрати</button>
      <button class="fab" id="addBtn" aria-label="Додати витрату"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="tab" data-view="stats"><svg class="i"><use href="#i-pie"/></svg>Статистика</button>
    </div>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="inner">
    <div class="grabber"></div>
    <div class="sheet-title">
      <span></span>
      <b id="sheetTitle">Нова витрата</b>
      <button class="icon-btn" id="closeSheet" aria-label="Закрити"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="amount-input">
      <input id="fAmount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Сума">
      <span class="cur" id="fCur">₴</span>
    </div>
    <div class="cats" id="fCats"></div>
    <div class="fields">
      <input id="fNote" class="full" type="text" placeholder="Коментар (необов'язково)" maxlength="80">
      <input id="fDate" class="full" type="date" aria-label="Дата">
    </div>
    <button class="btn primary" id="save">Зберегти</button>
    <button class="btn danger" id="del" hidden>Видалити витрату</button>
  </div>
</div>

<div class="lock" id="lock" hidden>
  <img src="icon.svg" alt="">
  <h1>Витрати</h1>
  <p>Додаток заблоковано</p>
  <button class="fp" id="unlockBtn" aria-label="Розблокувати відбитком"><svg class="i"><use href="#i-finger"/></svg></button>
  <p>Торкніться, щоб увійти</p>
  <button class="reset" id="lockReset">Не вдається увійти?</button>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
